[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ingest"
version = "0.1.0"
description = "Ingest pipeline: source snapshots, config extraction adapters, evidence-ledged claims (issues #13-#16)"
requires-python = ">=3.10"
dependencies = [
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
