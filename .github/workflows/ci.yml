name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (build / typecheck / vitest / playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @atlas/web build

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Regenerate golden artifacts and require clean diff
        run: |
          pnpm export:golden
          git diff --exit-code --stat tests/structural apps/web/public/figures

      - name: E2E smoke (Playwright)
        run: pnpm --filter @atlas/web test:e2e
        env:
          CI: true

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ingest package
        run: pip install -e "tools/ingest[dev]"

      - name: Unit tests (pytest)
        run: pytest tools/ingest
